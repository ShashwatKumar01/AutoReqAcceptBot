# Periodic MongoDB backup for AutoReqAcceptBot.
#
# Why runs often fail:
#   1. MONGODB_URI not set under Settings → Secrets → Actions
#   2. Atlas Network Access blocks GitHub IPs — add 0.0.0.0/0 (or disable this job and use Railway cron)
#   3. MONGODB_DATABASE wrong — must match Railway (usually RequestAcceptBot)
#
# Optional Telegram delivery (DM backup file to owner):
#   BOT_TOKEN — same as production bot
#   BACKUP_TELEGRAM_CHAT_ID — your numeric user ID (must have /start the bot in DM)
#
# Manual run: Actions → Mongo backup → Run workflow

name: Mongo backup

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::GitHub secret MONGODB_URI is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "MONGODB_URI is set (length ${#MONGODB_URI})"

      - name: Install deps
        run: pip install pymongo python-dotenv requests

      - name: Export database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          BACKUP_DIR: backup_out
        run: python scripts/mongo_backup.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongo-backup-${{ github.run_number }}
          path: backup_out/*.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Send backup to owner on Telegram
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BACKUP_TELEGRAM_CHAT_ID: ${{ secrets.BACKUP_TELEGRAM_CHAT_ID }}
          BACKUP_DIR: backup_out
        run: python scripts/mongo_backup_telegram_send.py
